artifacts = ["/app/knapsack.py"]
schema_version = "2.0"
[task]
name = "insight/knapsack"
description = "Exact 0/1 knapsack: maximum total value of items chosen at most once within an integer weight capacity. Graded by exact JSON comparison on a sample and six held-out seed-generated cases."
[metadata]
difficulty_explanation = "The textbook 0/1 knapsack. A correct solution is a capacity-indexed DP updated right-to-left so each item is used once; the common bug is a left-to-right update that reuses items (unbounded knapsack) or a greedy value/weight ratio that is not optimal."
solution_explanation = "A 1-D DP array dp[c] = best value at capacity c, updated for each item from high capacity down to the item weight. ~20 lines of standard-library Python."
verification_explanation = "A hidden verifier runs the candidate on one sample and six held-out seed-generated cases and compares the emitted JSON exactly. The stub emits a trivial/empty answer and fails (Nop = 0); the reference passes all (Oracle = 1)."
category = "SWE"
subcategory = "Dynamic Programming"
tags = ["python", "dynamic-programming", "knapsack", "optimization", "terminal-bench"]
expert_time_estimate_hours = 1
relevant_experience = "Dynamic programming and the knapsack family."
[verifier]
timeout_sec = 600.0
environment_mode = "separate"
[agent]
timeout_sec = 3600.0
[environment]
build_timeout_sec = 600.0
cpus = 1
