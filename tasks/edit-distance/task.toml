artifacts = ["/app/edit-distance.py"]
schema_version = "2.0"
[task]
name = "insight/edit-distance"
description = "Levenshtein edit distance: fewest single-character insertions, deletions, or substitutions turning string a into string b. Graded by exact JSON comparison on a sample and six held-out seed-generated cases."
[metadata]
difficulty_explanation = "The classic Levenshtein DP. A rolling two-row table gives the minimum over insert, delete, and substitute at each cell. Off-by-one base rows or treating a substitution as cost 0 on a mismatch are the usual errors."
solution_explanation = "A rolling DP over rows of b, each cell the min of delete, insert, and (sub cost 0/1) from the previous row. ~20 lines of standard-library Python."
verification_explanation = "A hidden verifier runs the candidate on one sample and six held-out seed-generated cases and compares the emitted JSON exactly. The stub emits a trivial/empty answer and fails (Nop = 0); the reference passes all (Oracle = 1)."
category = "SWE"
subcategory = "Dynamic Programming"
tags = ["python", "dynamic-programming", "edit-distance", "strings", "terminal-bench"]
expert_time_estimate_hours = 1
relevant_experience = "String edit-distance dynamic programming."
[verifier]
timeout_sec = 600.0
environment_mode = "separate"
[agent]
timeout_sec = 3600.0
[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
gpus = 0
